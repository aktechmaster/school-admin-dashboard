<style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        #sidebar { min-width: 250px; max-width: 250px; min-height: 100vh; transition: all 0.3s; }
        #sidebar.active { margin-left: -250px; }
        .nav-link { color: rgba(255,255,255,.8); margin-bottom: 5px; }
        .nav-link:hover, .nav-link.active { color: #fff; background-color: rgba(255,255,255,.1); border-radius: 5px; }
        .main-content { width: 100%; min-height: 100vh; }

        .table-scroll-wrapper {
            max-height: 70vh;
            overflow: auto;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            background: #fff;
        }

        .table-scroll-wrapper .table {
            margin-bottom: 0;
            min-width: max-content;
        }

        .table-scroll-wrapper thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(180deg, #0d6efd 0%, #0b5ed7 100%);
            color: #fff;
            white-space: nowrap;
            border-color: rgba(255,255,255,0.15);
        }

        .table-scroll-wrapper tbody td,
        .table-scroll-wrapper thead th {
            white-space: nowrap;
            min-width: 120px;
        }

        .table-scroll-wrapper tbody td {
            vertical-align: middle;
        }

        .table-scroll-wrapper th:nth-child(4),
        .table-scroll-wrapper td:nth-child(4),
        .table-scroll-wrapper th:nth-child(5),
        .table-scroll-wrapper td:nth-child(5) {
            min-width: 180px;
        }

        .table-scroll-wrapper th:nth-child(12),
        .table-scroll-wrapper td:nth-child(12) {
            min-width: 150px;
        }

        /* Membuat Overlay Login Menutup Penuh Seluruh Layar */
        #loginModal {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;
        }

        #loginModal .modal-dialog {
            max-width: 420px;
        }

        #loginModal .modal-content {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4) !important;
            overflow: hidden;
        }

        /* Menghilangkan latar berbayang bawaan bootstrap */
        .modal-backdrop {
            display: none !important;
        }
    </style>
