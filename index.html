    <!-- Modal Export Scope -->
    <div class="modal fade" id="exportScopeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exportScopeTitle">Pilih Scope Download</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-4">
                        Pilih data apa yang ingin diunduh.
                    </p>

                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="exportScope" id="scopeCurrentPage" value="current" checked>
                            <label class="form-check-label" for="scopeCurrentPage">
                                <strong>Halaman Ini</strong><br>
                                <small class="text-muted" id="currentPageInfo">Data yang ditampilkan sekarang</small>
                            </label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="exportScope" id="scopeAllData" value="all">
                            <label class="form-check-label" for="scopeAllData">
                                <strong>Semua Data</strong><br>
                                <small class="text-muted" id="allDataInfo">Semua data sesuai filter</small>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary" id="confirmExportBtn">Download</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 1. Konfigurasi & Engine Dynamic -->
    <script src="js/config.js"></script>
    <script src="js/table-engine.js"></script>
    <script src="js/export-engine.js"></script>

    <!-- 2. Modul Komponen -->
    <script src="js/modules/beranda.js"></script>
    <script src="js/modules/users.js"></script>
    <script src="js/modules/guru.js"></script>
    <script src="js/modules/siswa.js"></script>
    <script src="js/modules/kelas.js"></script>
    <script src="js/modules/mapel.js"></script>
    <script src="js/modules/jadwal.js"></script>
    <script src="js/auth.js"></script>

    <!-- 3. App Controller Utama -->
    <script src="js/app.js"></script>

    <!-- CDN untuk Export & Import Excel (SheetJS / XLSX) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- CDN untuk Export PDF (jsPDF + AutoTable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Script Engine Import -->
    <script src="js/import-engine.js"></script>
    
</body>
